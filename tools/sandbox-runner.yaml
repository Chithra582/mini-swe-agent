name: "sandbox-runner"
description: "Provisions and manages disposable Docker, Podman, or Bubblewrap execution sandboxes."
input_schema:
  type: "object"
  properties:
    environment_type:
      type: "string"
      enum:
        - "docker"
        - "podman"
        - "bubblewrap"
        - "local"
      description: "Isolation environment backend."
    image_tag:
      type: "string"
      description: "Container image tag to run."
  required:
    - "environment_type"
